<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>令和の虎年代表</title>
  <meta name="description" content="令和の虎まわりの“すごい人”年代表（学年ベース）。※敬称略。のっけたい人は連絡を。">

  <!-- OGP -->
  <meta property="og:title" content="令和の虎年代表">
  <meta property="og:description" content="令和の虎まわりの“すごい人”年代表（学年ベース）。※敬称略。">
  <!-- 自サイトの公開URLに差し替え推奨（JSは動かないため絶対URLが安全） -->
  <meta property="og:url" content="https://kimura-jane.github.io/reiwa-no-tora-age-map/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="令和の虎年代表">
  <!-- 1200×630の画像ファイルをリポジトリ直下に置く（例: ogp.jpg）-->
  <meta property="og:image" content="https://kimura-jane.github.io/reiwa-no-tora-age-map/ogp.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="令和の虎年代表｜学年版">

  <!-- Twitter card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="令和の虎年代表">
  <meta name="twitter:description" content="令和の虎まわりの“すごい人”年代表（学年ベース）。※敬称略。">
  <meta name="twitter:image" content="https://kimura-jane.github.io/reiwa-no-tora-age-map/ogp.jpg">

  <!-- あると便利 -->
  <link rel="canonical" href="https://kimura-jane.github.io/reiwa-no-tora-age-map/">
  <link rel="icon" href="favicon.ico">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <meta name="theme-color" content="#FFC72C">
</head>
<body>
  <header class="site-header">
    <h1>令和の虎年代表<span class="beta">学年版</span></h1>
    <div class="actions">
      <button id="yearBtn" aria-haspopup="dialog" aria-controls="yearDialog">年を選ぶ</button>
      <button id="sortBtn" aria-label="ソート切替">昇順</button>
      <button id="themeBtn" aria-label="配色切替">配色</button>
    </div>
  </header>

  <section class="notes" aria-label="注意書き">
    <ul>
      <li>※ のっけてほしい人、修正は連絡ください</li>
      <li>※ 敬称略</li>
      <li>※ 「世代」です。生まれ年ではありません（学年ベース）</li>
      <li>※ 生まれ年版も別途作成予定</li>
    </ul>
  </section>

  <section class="controls" aria-label="検索">
    <input id="search" type="search" inputmode="search" placeholder="名前で絞り込み…">
    <span id="hitCount" class="muted"></span>
  </section>

  <main id="list" class="list" aria-live="polite"></main>

  <footer class="site-footer">
    <small>© 令和の虎 / ファン作。非公式。データ提供歓迎。</small>
  </footer>

  <!-- 年選択モーダル -->
  <dialog id="yearDialog" class="dialog">
    <form method="dialog" class="dialog__frame">
      <header class="dialog__header">
        <strong>年を選ぶ</strong>
        <button value="close" class="dialog__close" aria-label="閉じる">×</button>
      </header>
      <div class="dialog__search">
        <input id="yearSearch" type="search" placeholder="59〜99, 00〜09 を検索">
      </div>
      <div id="yearList" class="dialog__list" role="listbox" aria-label="年一覧"></div>
      <footer class="dialog__footer">
        <button value="close">閉じる</button>
      </footer>
    </form>
  </dialog>

  <script src="data.js" defer></script>
  <script src="app.js?v=3" defer></script>
</body>
</html>
